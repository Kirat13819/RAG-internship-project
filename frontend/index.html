<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Vantree</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <nav class="topnav">
      <div class="wordmark">
        <span class="wordmark-mark">V</span>
        <span>Vantree</span>
      </div>
      <span class="status-dot" id="status-dot" title="Connecting…"></span>
    </nav>

    <div class="layout">
      <main class="main">
        <section id="home" class="home">
          <h1>Ask Vantree</h1>
          <p class="home-sub">Search the company's internal knowledge base</p>

          <form id="search-form" class="search-form">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="m21 21-4.3-4.3" stroke-linecap="round"/>
            </svg>
            <input
              id="search-input"
              type="text"
              placeholder="Ask anything about IT, HR, onboarding, or the product..."
              autocomplete="off"
            />
            <button type="submit" class="send-btn" aria-label="Search">
              <svg class="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="icon-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke-opacity="0.25"/>
                <path d="M21 12a9 9 0 0 0-9-9" stroke-linecap="round"/>
              </svg>
            </button>
          </form>

          <div class="chips" id="chips"></div>
        </section>

        <section id="thread" class="thread hidden">
          <div class="thread-scroll" id="thread-scroll"></div>

          <form id="followup-form" class="search-form followup-form">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="m21 21-4.3-4.3" stroke-linecap="round"/>
            </svg>
            <input
              id="followup-input"
              type="text"
              placeholder="Ask a follow-up..."
              autocomplete="off"
            />
            <button type="submit" class="send-btn" aria-label="Ask">
              <svg class="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="icon-spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke-opacity="0.25"/>
                <path d="M21 12a9 9 0 0 0-9-9" stroke-linecap="round"/>
              </svg>
            </button>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
